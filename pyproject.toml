[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "halo-pixelbar"
version = "1.2.0"
description = "花再 Halo PixelBar 控制工具：点阵屏文本 / 自定义位图 / 多帧动画 / 氛围灯 / 颜色校准"
readme = "docs/README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["edifier", "halo", "pixelbar", "hid", "pixel-art", "256x32"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
  "Environment :: Console",
]

dependencies = [
  "hidapi>=0.14",
  "pillow>=9",
]

[project.optional-dependencies]
audio = ["sounddevice>=0.4", "soundfile>=0.12"]

[project.scripts]
pixelbar = "pixelbar.cli:main"

[project.urls]
Homepage = "https://github.com/lankongtongmeng/dsh-pixelbar-studio"
Repository = "https://github.com/lankongtongmeng/dsh-pixelbar-studio"
Source = "https://github.com/lankongtongmeng/dsh-pixelbar-studio"
"素材来源" = "https://opengameart.org/content/24x32-peppercarrot-characters"

[tool.setuptools]
packages = ["pixelbar"]

[tool.setuptools.package-data]
pixelbar = ["anims.json"]
